name: Test Wheels

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: Interpreter to qualify with the built wheel
        type: choice
        default: all
        options: ['all', '3.11', '3.12', '3.13', '3.14', '3.15']

jobs:
  test_wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ${{ fromJSON(inputs.python_version == 'all' && '["3.11","3.12","3.13","3.14","3.15"]' || format('["{0}"]', inputs.python_version)) }}
    steps:
      - name: Checkout pyfolio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Create a notebook checkpoint for the packaging regression
        shell: python
        run: |
          from pathlib import Path
          import shutil
          notebook = Path("src/pyfolio/examples/round_trip_tear_sheet_example.ipynb")
          checkpoint = notebook.parent / ".ipynb_checkpoints" / f"{notebook.stem}-checkpoint.ipynb"
          checkpoint.parent.mkdir(exist_ok=True)
          shutil.copyfile(notebook, checkpoint)

      - name: Build and check distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Build with the minimum declared build dependencies
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          import tomllib
          requirements = tomllib.loads(Path("pyproject.toml").read_text())["build-system"]["requires"]
          Path("minimum-build-requirements.in").write_text("\n".join(requirements) + "\n")
          subprocess.check_call([
              "uv", "pip", "compile", "--resolution", "lowest-direct",
              "--python", sys.executable, "--output-file", "minimum-build-constraints.txt",
              "minimum-build-requirements.in",
          ])
          subprocess.check_call([
              "uv", "build", "--python", sys.executable,
              "--build-constraints", "minimum-build-constraints.txt",
              "--out-dir", "minimum-dist",
          ])
          distributions = list(Path("minimum-dist").glob("*.whl"))
          distributions += list(Path("minimum-dist").glob("*.tar.gz"))
          subprocess.check_call([sys.executable, "-m", "twine", "check", *map(str, distributions)])

      - name: Verify wheel payloads and exclude notebook checkpoints
        shell: python
        run: |
          import email
          from pathlib import Path
          import subprocess
          import tarfile
          import zipfile
          examples = subprocess.check_output([
              "git", "ls-files", "src/pyfolio/examples",
          ], text=True).splitlines()
          expected = {name.removeprefix("src/") for name in examples}
          with zipfile.ZipFile(next(Path("dist").glob("*.whl"))) as original:
              modules = {
                  name: original.read(name) for name in original.namelist()
                  if name.startswith("pyfolio/") and name.endswith(".py")
                  and name != "pyfolio/_version.py"
              }
          for folder in ["dist", "minimum-dist"]:
              with zipfile.ZipFile(next(Path(folder).glob("*.whl"))) as wheel:
                  actual = {name for name in wheel.namelist() if name.startswith("pyfolio/examples/")}
                  assert actual == expected, (actual, expected)
                  for name in examples:
                      assert wheel.read(name.removeprefix("src/")) == Path(name).read_bytes()
                  for name, content in modules.items():
                      assert wheel.read(name) == content
                  metadata = email.message_from_bytes(wheel.read(next(
                      name for name in wheel.namelist() if name.endswith("/METADATA")
                  )))
                  assert metadata["Name"] == "pyfolio-reloaded"
                  assert metadata["License-Expression"] == "Apache-2.0"
                  assert wheel.read(next(
                      name for name in wheel.namelist() if name.endswith("/licenses/LICENSE")
                  )) == Path("LICENSE").read_bytes()
              with tarfile.open(next(Path(folder).glob("*.tar.gz"))) as sdist:
                  assert not any(".ipynb_checkpoints" in name for name in sdist.getnames())

      - name: Upload qualification distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error

      - name: Download qualification distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions-${{ matrix.os }}-${{ matrix.python-version }}
          path: roundtrip-dist

      - name: Verify artifact roundtrip identity
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          expected = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in Path("dist").iterdir()}
          actual = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in Path("roundtrip-dist").iterdir()}
          assert expected == actual, (expected, actual)

      - name: Install the built wheel with declared test dependencies
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          wheel = next(Path("roundtrip-dist").glob("*.whl")).resolve()
          subprocess.check_call([sys.executable, "-m", "pip", "install", f"{wheel}[test]"])

      - name: Test installed wheel outside the source tree
        shell: python
        env:
          MPLBACKEND: Agg
        run: |
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tarfile
          scratch = Path(os.environ["RUNNER_TEMP"]) / "pyfolio-wheel-tests"
          unpacked = scratch / "sdist"
          unpacked.mkdir(parents=True)
          with tarfile.open(next(Path("roundtrip-dist").glob("*.tar.gz"))) as bundle:
              bundle.extractall(unpacked, filter="data")
          packaged = next(unpacked.iterdir())
          shutil.copytree(packaged / "tests", scratch / "tests")
          (scratch / "pytest.ini").write_text("[pytest]\ntestpaths = tests\n")
          subprocess.check_call([
              sys.executable, "-I", "-c",
              "import importlib.metadata as m, pyfolio; assert pyfolio.__version__ == m.version('pyfolio-reloaded')",
          ], cwd=scratch)
          subprocess.check_call([
              sys.executable, "-I", "-m", "pytest", "-n", "2",
              "--cov=pyfolio", "--cov-report=term", "--tb=short", "tests",
          ], cwd=scratch)

      - name: Execute original offline notebooks with the installed package
        if: matrix.python-version == '3.11' || matrix.python-version == '3.15'
        shell: python
        env:
          MPLBACKEND: Agg
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          scratch = Path(os.environ["RUNNER_TEMP"]) / "pyfolio-wheel-tests"
          subprocess.check_call([
              sys.executable, "-I", str(scratch / "tests" / "check_notebooks.py"),
              "--output", str(scratch / "notebook-results"),
          ], cwd=scratch)

      - name: Smoke test the minimum-backend wheel version API
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import sys
          import zipfile
          wheel = next(Path("minimum-dist").glob("*.whl")).resolve()
          with zipfile.ZipFile(wheel) as bundle:
              version_hash = hashlib.sha256(bundle.read("pyfolio/_version.py")).hexdigest()
          subprocess.check_call([
              sys.executable, "-m", "pip", "install", "--force-reinstall", "--no-deps", str(wheel),
          ])
          subprocess.check_call([
              sys.executable, "-I", "-c",
              "import hashlib, importlib.metadata as m, pathlib, pyfolio, sys; "
              "assert pyfolio.__version__ == m.version('pyfolio-reloaded'); "
              "assert hashlib.sha256(pathlib.Path(pyfolio.__file__).with_name('_version.py').read_bytes()).hexdigest() == sys.argv[1]",
              version_hash,
          ], cwd=os.environ["RUNNER_TEMP"])
