name: Tests

on:
  workflow_dispatch:
    inputs:
      minimum_python_only:
        description: Run only the declared minimum Python version
        type: boolean
        default: false
  schedule:
    - cron: "0 9 * * 6"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Unit Tests for ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest , windows-latest, macos-latest ]
        python-version: ${{ fromJSON(inputs.minimum_python_only && '["3.11"]' || '["3.11","3.12","3.13","3.14","3.15"]') }}
    steps:
      - name: Checkout pyfolio
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pyfolio
        run: |
          python -m pip install --upgrade pip
          pip install tox tox-gh-actions
          pip install -e .[test]

      - name: Lint with flake8
        run: |
          flake8

      - name: Tests with tox & pytest
        run: |
          tox
